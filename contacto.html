<!DOCTYPE html>
<!-- Declaración del tipo de documento: indica que este archivo es HTML5 -->

<html lang="es">
<!-- Elemento raíz del documento HTML. El atributo lang indica el idioma -->

<head>
    <!-- Contiene metadatos del documento (no visibles directamente en la página) -->

    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que el sitio sea responsive (adaptable a móviles y tablets) -->
    <meta name="author" content="Jessica Arely Aparicio García">
    <!-- Autor del documento -->

    <title>Pagina de contactanos</title>
    <!-- Título que aparece en la pestaña del navegador -->

    
</head>
<body>
<main>
      <!-- Contenido principal de la página -->
<section id="formulario">
            <!-- Sección con un formulario completo -->
            
            <form action="#" method="post">
                
                <fieldset>
                    
                    <!-- Agrupa campos relacionados -->
                    <legend><h1>Contáctanos</h1></legend>
                    
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    <br><br>
                    <label for="correo">Correo Electronico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    <br><br>
                    <label for="numero">Telefono (opcional):</label>
                    <input type="text" id="numero" name="numero" placeholder="5552226688" >
                    <br><br>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de contacto" required>
                    <br><br>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="8"></textarea>
                    <br><br>
                    <input type="submit" value="Enviar">
                    <br><br>
                    

                </fieldset>
            </form>
</section>
</main>
</body>
</html>
